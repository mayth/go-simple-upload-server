name: Docker Image CI

on:
  push:
    branches: [ "v2" ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ "v2" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag mayth/simple-upload-server:$(date +%s)

  push:
    runs-on: ubuntu-latest
    steps:
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          mayth/simple-upload-server
        tags: |
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
    - uses: actions/checkout@v6
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Test
      run: |
        docker compose -f docker-compose.e2e.yml run --rm test
        docker compose -f docker-compose.e2e.yml down --rmi local --volumes
    - name: Build and Publish
      uses: docker/build-push-action@v7
      with:
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
